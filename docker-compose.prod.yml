name: exerceo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exerceo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-exerceo}
    volumes:
      - exerceo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - exerceo

  server:
    build: .
    image: ${EXERCEO_SERVER_IMAGE:-exerceo-server:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-exerceo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exerceo}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN:-https://exerceo.covium.tech}
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5
    networks:
      - exerceo

volumes:
  exerceo-pgdata:

networks:
  exerceo:
