name: exerceo

services:
  postgres:
    image: postgres:16-alpine
    container_name: exerceo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exerceo
      POSTGRES_PASSWORD: exerceo
      POSTGRES_DB: exerceo
    ports:
      - '5432:5432'
    volumes:
      - exerceo-pgdata:/var/lib/postgresql/data

volumes:
  exerceo-pgdata:
