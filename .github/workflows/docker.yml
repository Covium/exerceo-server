name: Docker

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: SSH to the VPS and run docker compose up
        type: boolean
        default: true

env:
  POSTGRES_PASSWORD: ci-build-only
  JWT_SECRET: ci-build-only

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          image="${{ steps.image.outputs.name }}"
          docker tag exerceo-server:local "$image:${GITHUB_SHA}"
          docker tag exerceo-server:local "$image:latest"
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"

  deploy:
    needs: build
    if: github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: exerceo-server-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/exerceo-server' }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: docker-compose.prod.yml,deploy/remote-up.sh
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Pull image and start Compose
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          EXERCEO_SERVER_IMAGE: ${{ env.IMAGE }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,EXERCEO_SERVER_IMAGE,DEPLOY_PATH
          script: |
            set -eu
            chmod +x "$DEPLOY_PATH/deploy/remote-up.sh"
            "$DEPLOY_PATH/deploy/remote-up.sh"
